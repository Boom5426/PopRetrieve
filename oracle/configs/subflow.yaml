# SubFlow config — subpopulation-aware conditional flow matching for drug ranking
seed: 0
device: cuda

data:
  processed_path: data/processed/sciplex3_all.pt
  annotation_dir: data/annotation
  drug_features_path: data/annotation/drug_morgan_ecfp4.npy
  splits_dir: data/splits
  split: random          # random | drug_disjoint | moa_disjoint | cell_line_disjoint_{A549,MCF7}
  val_fold: val

model:
  pop_hidden: 512
  pop_dim: 256
  drug_dim: 256
  emb_dim: 128
  dropout: 0.1

flow:
  K: 4                    # subpopulations for coverage scoring
  beta: 8.0               # coverage temperature (0 -> mean, inf -> worst-subpop)
  n_steps: 8              # Euler integration steps for generation
  include_source_context: true
  lambda_fm: 1.0          # flow-matching regression weight
  lambda_tgt: 1.0         # protein-target BCE weight (keeps drug identity informative)
  lambda_ed: 0.0          # energy-distance fine-tune weight (0 until ed_start_epoch)
  ed_start_epoch: 1000    # effectively off by default; enable for late-stage tuning
  ed_n_steps: 4           # cheap generation for the ed term

train:
  epochs: 60
  batch_size: 16
  n_source: 128
  n_target: 128
  num_workers: 6
  lr: 3.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  bce_pos_weight: 20.0
  max_train_conditions: 100000

eval:
  every: 5
  query_batch: 16

out:
  ckpt_dir: checkpoints
  results_dir: results/subflow
