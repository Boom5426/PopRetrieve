[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "popretrieve"
version = "0.1.0"
description = "Population-to-population retrieval metrics and evaluation audits for single-cell drug response"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Boom5426" },
]
keywords = ["single-cell", "drug retrieval", "distributional distance", "perturbation", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
popretrieve-hir-benchmark = "experiments.exp11_hir_benchmark:main"
popretrieve-recompute-headlines = "experiments.recompute_all:main"

[project.urls]
Repository = "https://github.com/Boom5426/PopRetrieve"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "popretrieve*",
    "retrieval*",
    "baselines*",
    "benchmarks*",
    "data*",
    "experiments*",
    "utils*",
]
